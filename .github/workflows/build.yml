name: 构建与测试
on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 构建通过后直接推送到 GitHub Releases
        required: false
        type: boolean
        default: false
      release_tag:
        description: 发布的版本标签（如 v0.1.30 或 v0.1.30-Inside；留空则按上一版末位自动 +1）
        required: false
        type: string
        default: ''
      version_suffix:
        description: 可选：版本结尾字母后缀（如 -Inside、-dev；标签未自带后缀或留空自动递增时拼接）
        required: false
        type: string
        default: ''
      prerelease:
        description: 勾选为预发布版（Pre-release）；取消勾选则发布为正式版
        required: false
        type: boolean
        default: true
      release_notes_zh:
        description: 可选：直接指定中文更新说明（留空则按提交日志与 CHANGELOG 汇总）
        required: false
        type: string
        default: ''
      release_notes_en:
        description: 可选：直接指定英文更新说明（留空则按提交日志汇总）
        required: false
        type: string
        default: ''
      run_gpu:
        description: 在标记为 gpu 的自托管 Windows 机器上做真机验收（含 FSR / XeSS / DLSS）
        required: false
        type: boolean
        default: false
      gpu_required_providers:
        description: 真机上必须能初始化的超分（空格分隔，如 "Fsr XeSs Dlss"；留空只记录结果）
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  MDA_WORK_ROOT: ${{ github.workspace }}/.mda-work
  # Directory.Build.props 把 bin/obj 放在仓库外；固定位置，方便各任务共用编译结果。
  ModernCacheRoot: ${{ github.workspace }}/.modern
jobs:
  # 先做不需要编译的快速检查。
  lint:
    name: 文案与清单检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.tag }}
      release_version: ${{ steps.resolve-tag.outputs.version }}
      previous_tag: ${{ steps.resolve-tag.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解析发布版本号
        id: resolve-tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_VERSION_SUFFIX: ${{ inputs.version_suffix || '' }}
        run: python scripts/resolve-release-tag.py --repo "$GITHUB_REPOSITORY" --write-github-output
      - name: 三语文案（zh-CN / en / ja）及界面引用
        run: python scripts/check-localization.py
      - name: 固定版本清单是合法 JSON
        run: |
          for f in tools/ffmpeg/manifest.json tools/dxc/manifest.json tools/upscaling/manifest.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8-sig'))" "$f" && echo "通过 $f"
          done
      - name: 仓库文本中没有凭据
        run: |
          if git grep -nIE '(gh[pousr]_[A-Za-z0-9]{25,}|github_pat_[A-Za-z0-9_]{25,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!*.lock.json'; then
            echo "::error::仓库里有疑似凭据的文本"; exit 1
          fi

  build:
    name: 编译
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # 物理、切线和着色器测试要用真实的原生库；先编好，再随编译结果一起交给测试任务。
      - name: 编译原生依赖（Bullet 刚体／软体、MikkTSpace）并取得 DXC
        shell: pwsh
        run: ./scripts/ci-native-deps.ps1 -OutputDirectory "${{ github.workspace }}/.modern/native"
      - name: 按锁定版本还原依赖并编译全部项目
        shell: pwsh
        run: |
          dotnet restore Mmd.Modern.slnx --locked-mode
          dotnet build Mmd.Modern.slnx -c Release --no-restore $env:MDA_NATIVE_PROPERTIES.Split(' ')
      - name: 打包编译结果给测试任务
        shell: pwsh
        run: tar -czf build-output.tgz -C "$env:ModernCacheRoot" bin obj native/dxc
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tgz
          retention-days: 1

  # 云端机器没有显卡：跳过 Category=Gpu 的测试，留给下面的真机验收。
  # “编辑器与渲染”额外跳过穷举 48 种宏组合的慢速着色器编译类（改着色器时在本地跑），将测试耗时控制在数分钟内。
  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 格式·调度·插件
            projects: Mmd.Modern.Formats.Tests Mmd.Modern.Scheduling.Tests Mmd.Modern.Plugins.Tests
            filter: Category!=Gpu
            required: true
          - name: 应用与物理
            projects: Mmd.Modern.Application.Tests
            filter: Category!=Gpu
            required: true
          - name: 输出与编码
            projects: Mmd.Modern.ViewOutput.Tests Mmd.Modern.ViewOutput.FFmpeg.Tests
            filter: Category!=Gpu
            required: true
          - name: 传统引擎兼容
            projects: Mmd.Modern.Rendering.D3D9.Compatibility.Tests Mmd.Modern.ViewOutput.D3D9.Compatibility.Tests
            filter: Category!=Gpu
            required: true
          - name: 编辑器与渲染
            projects: Mmd.Modern.Tests
            filter: Category!=Gpu&FullyQualifiedName!~ShaderTests&FullyQualifiedName!~ShaderVariantsTests&FullyQualifiedName!~SurfaceTests&FullyQualifiedName!~FaceSdfTests
            required: true
    name: 测试（${{ matrix.name }}）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: 还原编译结果
        shell: pwsh
        run: |
          $workRoot = "${{ runner.temp }}\w"
          $dxcTestCache = "${{ runner.temp }}\dxc-test-cache"
          New-Item -ItemType Directory -Force -Path $env:ModernCacheRoot, $workRoot, $dxcTestCache | Out-Null
          tar -xzf build-output.tgz -C "$env:ModernCacheRoot"
          "MDA_WORK_ROOT=$workRoot" >> $env:GITHUB_ENV
          "MMD_DXC_PATH=$env:ModernCacheRoot\native\dxc\dxc.exe" >> $env:GITHUB_ENV
          "MMD_DXC_TEST_CACHE=$dxcTestCache" >> $env:GITHUB_ENV
          dotnet restore Mmd.Modern.slnx --locked-mode
      - name: 取得固定版本 FFmpeg（真实编码测试用）
        if: contains(matrix.projects, 'FFmpeg')
        shell: pwsh
        run: |
          $bin = ./scripts/fetch-ffmpeg.ps1 -Destination "${{ runner.temp }}/ffmpeg"
          "MMD_FFMPEG_PATH=$bin\ffmpeg.exe" >> $env:GITHUB_ENV
          "MMD_FFPROBE_PATH=$bin\ffprobe.exe" >> $env:GITHUB_ENV
      - name: 运行测试
        shell: pwsh
        run: |
          $failed = @()
          foreach ($project in '${{ matrix.projects }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            dotnet test "tests/$project" -c Release --no-build --no-restore --filter '${{ matrix.filter }}' `
              --logger "trx;LogFileName=$project.trx" --results-directory artifacts/tests `
              --blame-hang-timeout 10m
            if ($LASTEXITCODE) { $failed += $project }
          }
          if ($failed) { Write-Output "::error::以下测试项目有失败：$($failed -join '、')"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 测试结果-${{ matrix.name }}
          path: artifacts/tests/
          retention-days: 14

  windows-build:
    name: Windows 构建包
    needs: [lint, build]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 编译 Windows x64 版（含原生物理库和固定版本 FFmpeg）
        shell: pwsh
        env:
          RESOLVED_VERSION: ${{ needs.lint.outputs.release_version }}
        run: |
          $ver = if ($env:RESOLVED_VERSION) { $env:RESOLVED_VERSION } else { '0.2.0' }
          ./scripts/ci-windows-build.ps1 -OutputDirectory "${{ runner.temp }}/mda-windows" -WorkDirectory "${{ runner.temp }}/mda-build" -Version $ver -CommitSha $env:GITHUB_SHA
      # FSR（AMD FidelityFX）、XeSS（Intel）、DLSS（NVIDIA）：固定版本、带厂商签名的运行库，
      # 外加在这里用 MSVC 现编的 MDA DLSS 桥接库。能否使用仍由用户的显卡决定。
      - name: 加入 FSR / XeSS / DLSS 超分
        shell: pwsh
        run: ./scripts/ci-stage-upscalers.ps1 -PublishedDirectory "${{ runner.temp }}/mda-windows" -WorkDirectory "${{ runner.temp }}/mda-upscalers"
      - name: 加入传统（Classic）渲染引擎
        shell: pwsh
        run: ./scripts/ci-stage-classic.ps1 -PublishedDirectory "${{ runner.temp }}/mda-windows" -WorkDirectory "${{ runner.temp }}/mda-classic"
      - name: 检查可选运行库的安装路径（不需要显卡）
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/optional-runtimes"
          ./scripts/verify-editor-optional-runtimes.ps1 -PublishedDirectory "${{ runner.temp }}/mda-windows" -OutputDirectory $out
          if ($LASTEXITCODE) { Write-Output '::warning::云端机器没有 D3D12 显卡，这里只检查安装是否正确。' }
        continue-on-error: true
      - name: 编译 Inno Setup 安装包
        id: installer
        shell: pwsh
        env:
          RESOLVED_VERSION: ${{ needs.lint.outputs.release_version }}
        run: |
          $ver = if ($env:RESOLVED_VERSION) { $env:RESOLVED_VERSION } else { '0.2.0' }
          ./scripts/ci-package-installer.ps1 `
            -PublishedDirectory "${{ runner.temp }}/mda-windows" `
            -Version $ver `
            -StageDirectory "${{ runner.temp }}/mda-stage-check" `
            -InstallerOutputDirectory "${{ runner.temp }}/mda-installer-out" `
            -NugetPackages "${{ github.workspace }}/.nuget/packages"
          Remove-Item -LiteralPath "${{ runner.temp }}/mda-stage-check" -Recurse -Force -ErrorAction SilentlyContinue
          "setup=$env:RUNNER_TEMP/mda-installer-out/MDA-$ver-win-x64-setup.exe" >> $env:GITHUB_OUTPUT
      - name: 实装验证简体中文、文件关联与画风插件
        shell: pwsh
        env:
          RESOLVED_VERSION: ${{ needs.lint.outputs.release_version }}
        run: |
          $ver = if ($env:RESOLVED_VERSION) { $env:RESOLVED_VERSION } else { '0.2.0' }
          ./scripts/ci-check-installer-associations.ps1 `
            -Installer "${{ steps.installer.outputs.setup }}" `
            -WorkDirectory "${{ runner.temp }}/mda-associations" `
            -ExpectedVersion $ver
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        with:
          name: MDA-installer-win-x64
          path: ${{ runner.temp }}/mda-installer-out/*.exe
          retention-days: 7
      - name: 在摘要中列出超分文件
        shell: pwsh
        run: |
          $installed = Get-Content "${{ runner.temp }}/mda-windows/tools/upscaling/installed.json" -Raw | ConvertFrom-Json
          $lines = @('### 本次构建包含的超分组件', '', '| 文件 | 大小 | SHA-256 |', '| --- | ---: | --- |')
          foreach ($f in $installed.files) { $lines += "| ``$($f.path)`` | $([math]::Round($f.bytes / 1MB, 2)) MB | ``$($f.sha256.Substring(0, 16))…`` |" }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: MDA-modern-development-win-x64
          path: ${{ runner.temp }}/mda-windows/
          retention-days: 14

  publish-release:
    name: 推送 GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [lint, test, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.lint.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.lint.outputs.release_version }}
      PREVIOUS_TAG: ${{ needs.lint.outputs.previous_tag }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
      EXTRA_ZH: ${{ inputs.release_notes_zh }}
      EXTRA_EN: ${{ inputs.release_notes_en }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: MDA-installer-win-x64
          path: ${{ runner.temp }}/mda-installer
      - name: 汇总提交日志生成中英双语更新说明（中文在前）
        run: |
          python scripts/generate-release-notes.py \
            --tag "$RELEASE_TAG" \
            --target-ref "$GITHUB_SHA" \
            --output "${{ runner.temp }}/release-notes.md"
          cat "${{ runner.temp }}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: 校验附件哈希并推送到 GitHub Releases
        run: |
          python scripts/ci-publish-release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --installer "${{ runner.temp }}/mda-installer/MDA-${RELEASE_VERSION}-win-x64-setup.exe" \
            --notes "${{ runner.temp }}/release-notes.md" \
            --staging-dir "${{ runner.temp }}/release-upload" \
            --prerelease "$IS_PRERELEASE"

  gpu-acceptance:
    name: 真机 GPU 验收
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    needs: windows-build
    runs-on: [self-hosted, Windows, X64, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102
      - uses: actions/download-artifact@v4
        with:
          name: MDA-modern-development-win-x64
          path: ${{ runner.temp }}/mda-windows
      - name: 真机渲染与 Bepu 物理验收
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: 真机上检查 FSR / XeSS / DLSS
        shell: pwsh
        run: |
          $required = '${{ inputs.gpu_required_providers }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          ./scripts/verify-editor-optional-runtimes.ps1 -PublishedDirectory "${{ runner.temp }}/mda-windows" -OutputDirectory artifacts/gpu/optional-runtimes -RequiredProviders $required
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 真机验收结果
          path: |
            artifacts/gpu/
            artifacts/green/*.trx
