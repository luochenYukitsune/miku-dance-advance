name: publish-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared draft release tag (for example v0.1.29)
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/build.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check installer and source attachments, then publish
        run: python scripts/publish-prepared-release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
