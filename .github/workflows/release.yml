name: 发布 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本标签（如 v0.1.30；留空则按上一版末位自动 +1）
        required: false
        type: string
        default: ''
      prerelease:
        description: 勾选为预发布版（Pre-release）；取消勾选则发布为正式版
        required: false
        type: boolean
        default: true
      previous_tag:
        description: 对比提交日志的上一版标签（留空则自动查找上一版 v* 标签）
        required: false
        type: string
        default: ''
      extra_zh:
        description: 可选：直接指定中文更新要点（多行；留空则自动按提交日志与 CHANGELOG 汇总）
        required: false
        type: string
        default: ''
      extra_en:
        description: 可选：直接指定英文更新要点（多行；留空则自动按提交日志汇总）
        required: false
        type: string
        default: ''
permissions:
  contents: read
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
jobs:
  lint:
    name: 发布前文案与标签检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.tag }}
      release_version: ${{ steps.resolve-tag.outputs.version }}
      previous_tag: ${{ steps.resolve-tag.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解析或自动递增发布版本号
        id: resolve-tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previous_tag || '' }}
        run: python scripts/resolve-release-tag.py --repo "$GITHUB_REPOSITORY" --write-github-output
      - name: 三语文案及固定版本清单检查
        run: |
          python scripts/check-localization.py
          for f in tools/ffmpeg/manifest.json tools/dxc/manifest.json tools/upscaling/manifest.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8-sig'))" "$f"
          done
      - name: 仓库文本中没有凭据
        run: |
          if git grep -nIE '(gh[pousr]_[A-Za-z0-9]{25,}|github_pat_[A-Za-z0-9_]{25,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!*.lock.json'; then
            echo "::error::仓库里有疑似凭据的文本"; exit 1
          fi

  publish:
    name: 构建双引擎安装包并推送 GitHub Release
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.lint.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.lint.outputs.release_version }}
      PREVIOUS_TAG: ${{ needs.lint.outputs.previous_tag }}
      IS_PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
      EXTRA_ZH: ${{ inputs.extra_zh || '' }}
      EXTRA_EN: ${{ inputs.extra_en || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 编译现代引擎与内置 FFmpeg / DXC
        shell: pwsh
        run: ./scripts/ci-windows-build.ps1 -OutputDirectory "${{ runner.temp }}/mda-windows" -WorkDirectory "${{ runner.temp }}/mda-build"
      - name: 加入 FSR / XeSS / DLSS 超分
        shell: pwsh
        run: ./scripts/ci-stage-upscalers.ps1 -PublishedDirectory "${{ runner.temp }}/mda-windows" -WorkDirectory "${{ runner.temp }}/mda-upscalers"
      - name: 加入传统（Classic）渲染引擎
        shell: pwsh
        run: ./scripts/ci-stage-classic.ps1 -PublishedDirectory "${{ runner.temp }}/mda-windows" -WorkDirectory "${{ runner.temp }}/mda-classic"
      - name: 使用 Inno Setup 编译安装程序
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "${{ runner.temp }}/mda-build", "${{ runner.temp }}/mda-upscalers", "${{ runner.temp }}/mda-classic" -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/ci-package-installer.ps1 `
            -PublishedDirectory "${{ runner.temp }}/mda-windows" `
            -Version $env:RELEASE_VERSION `
            -StageDirectory "${{ runner.temp }}/mda-stage" `
            -InstallerOutputDirectory "${{ runner.temp }}/mda-installer" `
            -NugetPackages "${{ github.workspace }}/.nuget/packages"
          Remove-Item -LiteralPath "${{ runner.temp }}/mda-windows", "${{ runner.temp }}/mda-stage" -Recurse -Force -ErrorAction SilentlyContinue
      - name: 实装验证简体中文与文件关联
        shell: pwsh
        run: |
          ./scripts/ci-check-installer-associations.ps1 `
            -Installer "${{ runner.temp }}/mda-installer/MDA-$env:RELEASE_VERSION-win-x64-setup.exe" `
            -WorkDirectory "${{ runner.temp }}/mda-associations"
      - name: 汇总提交日志生成中英双语更新说明（中文在前）
        shell: pwsh
        run: |
          python -X utf8 scripts/generate-release-notes.py `
            --tag $env:RELEASE_TAG `
            --target-ref $env:GITHUB_SHA `
            --output "${{ runner.temp }}/release-notes.md"
          Get-Content -LiteralPath "${{ runner.temp }}/release-notes.md" -Raw >> $env:GITHUB_STEP_SUMMARY
      - name: 校验附件哈希并推送到 GitHub Releases
        shell: pwsh
        run: |
          python -X utf8 scripts/ci-publish-release.py `
            --repo $env:GITHUB_REPOSITORY `
            --tag $env:RELEASE_TAG `
            --commit $env:GITHUB_SHA `
            --installer "${{ runner.temp }}/mda-installer/MDA-$($env:RELEASE_VERSION)-win-x64-setup.exe" `
            --notes "${{ runner.temp }}/release-notes.md" `
            --staging-dir "${{ runner.temp }}/release-upload" `
            --prerelease $env:IS_PRERELEASE
